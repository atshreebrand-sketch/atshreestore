<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | ATSHREE</title><link rel="stylesheet" href="styles.css"></head><body><div class="top">FREE SHIPPING ON ORDERS ABOVE ₹1,999 · EASY 7-DAY EXCHANGE</div><nav class="nav"><a class="logo" href="index.html">ATSHREE</a><div class="links"><a href="shop.html">NEW IN</a><a href="shop.html?category=Men">MEN</a><a href="shop.html?category=Women">WOMEN</a><a href="about.html">OUR STORY</a><a href="rewards.html">REWARDS</a></div><div class="navRight"><a class="accountLink" href="account.html">ACCOUNT</a><a class="bag" href="checkout.html">BAG</a></div></nav><main><section class="section"><div class="wrap" id="detail"></div></section></main><footer class="footer"><div class="wrap footgrid"><div><div class="logo" style="color:#fff">ATSHREE</div><p>Modern Indian ethnic wear.<br>Tradition, reimagined.</p></div><div><h4>SHOP</h4><a href="shop.html">New In</a><br><a href="shop.html?category=Men">Men</a><br><a href="shop.html?category=Women">Women</a></div><div><h4>HELP</h4><a href="shipping.html">Shipping</a><br><a href="returns.html">Returns</a><br><a href="contact.html">Contact</a></div><div><h4>LEGAL</h4><a href="privacy.html">Privacy</a><br><a href="terms.html">Terms</a><br><a href="refund.html">Refunds</a></div></div></footer><script src="app.js"></script><script>
const productId=Number(new URLSearchParams(location.search).get('id'))||1;let selectedSize='M';
function renderProduct(p){if(!p)return;const sizes=Array.isArray(p.sizes)&&p.sizes.length?p.sizes:['S','M','L','XL'];selectedSize=sizes.includes('M')?'M':sizes[0];const price=p.sale??p.p;const old=p.sale?`<span style="text-decoration:line-through;opacity:.55;margin-left:8px">${money(p.p)}</span>`:'';document.querySelector('#detail').innerHTML=`<div class="detail"><div><img src="${p.i}" alt="${p.n}"></div><div><div class="ey">${p.c} · ATSHREE</div><h1>${p.n}</h1><div class="price">${money(price)}${old}</div><p>${p.description||'A refined ATSHREE piece designed for modern Indian occasions.'}</p>${p.fabric?`<p><strong>FABRIC</strong><br>${p.fabric}</p>`:''}<h4>SELECT SIZE</h4><div id="sizes">${sizes.map(s=>`<button class="btn sizeBtn" data-size="${s}">${s}</button>`).join('')}</div><br><button class="btn" id="addBagBtn">ADD TO BAG</button><ul style="color:#756a60;line-height:2;font-size:12px"><li>Free shipping above ₹1,999</li><li>7-day exchange</li><li>Secure checkout</li></ul></div></div>`;document.querySelectorAll('.sizeBtn').forEach(btn=>btn.addEventListener('click',()=>selectSize(btn.dataset.size)));document.querySelector('#addBagBtn').addEventListener('click',()=>add(p.id,selectedSize));selectSize(selectedSize);}
function selectSize(size){selectedSize=size;document.querySelectorAll('.sizeBtn').forEach(btn=>{btn.style.background=btn.dataset.size===size?'#17130f':'#fff';btn.style.color=btn.dataset.size===size?'#fff':'#17130f'})}
renderProduct(PRODUCTS.find(x=>x.id===productId)||PRODUCTS[0]);window.addEventListener('atshree-products-ready',()=>renderProduct(PRODUCTS.find(x=>x.id===productId)));
</script><script src="/features.js"></script></body></html>
