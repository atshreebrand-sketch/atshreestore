<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATSHREE Admin Login</title>
<link rel="stylesheet" href="/styles.css">
<style>
.adminLogin{min-height:70vh;display:grid;place-items:center;padding:60px 20px}.adminLoginCard{width:min(440px,100%);background:#fff;border:1px solid #ddd;padding:34px}.adminLoginCard h1{margin:8px 0 10px}.adminLoginCard .form{margin-top:24px}.adminMsg{min-height:24px;margin-top:14px}.adminError{color:#8b2f2f}.adminSuccess{color:#246b36}.adminHint{font-size:12px;color:#756a60;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="top">ATSHREE · ADMIN ACCESS</div>
<nav class="nav"><a class="logo" href="/index.html">ATSHREE</a><div class="links"><a href="/shop.html">STORE</a></div><a class="bag" href="/account.html">ACCOUNT</a></nav>
<main><section class="adminLogin"><div class="adminLoginCard">
<div class="ey">ATSHREE CONTROL CENTER</div><h1>Admin Login</h1><p>Sign in with your ATSHREE administrator account.</p>
<form id="adminLoginForm" class="form">
<input id="email" type="email" autocomplete="username" placeholder="Admin email" required>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button class="btn" id="loginBtn" type="submit">LOGIN TO ADMIN</button>
</form>
<p id="adminMsg" class="adminMsg"></p>
<p class="adminHint">Your normal ATSHREE account password is used. Only an account marked as an ATSHREE administrator can enter the dashboard.</p>
</div></section></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://schsitbayzsqalkvnpbs.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_rHtZGmayQqlWsI-g8g_6_7LnaFz';
const supabaseClient=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const form=document.querySelector('#adminLoginForm');
const msg=document.querySelector('#adminMsg');
const btn=document.querySelector('#loginBtn');

async function adminProfile(userId){
  const {data,error}=await supabaseClient.from('profiles').select('is_admin').eq('id',userId).maybeSingle();
  if(error) throw error;
  return data;
}

async function checkSession(){
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session) return;
    const profile=await adminProfile(session.user.id);
    if(profile?.is_admin) location.replace('/admin.html');
  }catch(error){
    console.warn('Admin session check:',error);
  }
}

checkSession();

form.addEventListener('submit',async e=>{
  e.preventDefault();
  btn.disabled=true;
  msg.className='adminMsg';
  msg.textContent='Signing in…';
  try{
    const {data,error}=await supabaseClient.auth.signInWithPassword({
      email:form.email.value.trim(),
      password:form.password.value
    });
    if(error) throw error;
    const user=data?.user;
    if(!user) throw new Error('Login succeeded but no user was returned.');
    const profile=await adminProfile(user.id);
    if(!profile?.is_admin){
      await supabaseClient.auth.signOut();
      throw new Error('This account does not have admin access.');
    }
    msg.className='adminMsg adminSuccess';
    msg.textContent='Login successful. Opening admin dashboard…';
    location.replace('/admin.html');
  }catch(error){
    console.error('ATSHREE admin login:',error);
    msg.className='adminMsg adminError';
    msg.textContent=error?.message||'Unable to sign in. Please try again.';
    btn.disabled=false;
  }
});
</script>
</body>
</html>
