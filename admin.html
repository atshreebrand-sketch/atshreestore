<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATSHREE Admin</title><link rel="stylesheet" href="/styles.css"><style>.productAdmin{margin:28px 0}.productAdmin details,.couponAdmin details{background:#fff;border:1px solid #ddd;padding:22px}.productAdmin summary,.couponAdmin summary{cursor:pointer;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.productForm,.couponForm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.productForm .full,.couponForm .full{grid-column:1/-1}.productForm label,.couponForm label{display:flex;flex-direction:column;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#756a60}.productForm input,.productForm select,.productForm textarea,.couponForm input,.couponForm select{font:inherit;text-transform:none;letter-spacing:0;border:1px solid #ccc;padding:12px;background:#fff;color:#17130f}.productForm textarea{min-height:90px;resize:vertical}.productChecks{display:flex;gap:20px;align-items:center;padding-top:22px}.productChecks label{display:flex;flex-direction:row;align-items:center;gap:8px}.productActions{display:flex;gap:10px;margin-top:18px}.productActions button{border:1px solid #17130f;background:#17130f;color:#fff;padding:12px 18px;cursor:pointer}.productActions .secondary{background:#fff;color:#17130f}.imagePreview{max-width:120px;max-height:120px;object-fit:cover;border:1px solid #ddd;margin-top:8px;display:none}.productRow{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;border-top:1px solid #e5e1dc;padding:16px 0}.productThumb{width:70px;height:90px;object-fit:cover;background:#f3f1ed}.productRow h3{margin:0 0 5px}.productRow small{display:block;color:#756a60;line-height:1.6}.productRowActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.productRowActions button,.textBtn{border:0;background:none;text-decoration:underline;cursor:pointer;font-size:11px;letter-spacing:.05em}.adminNotice{margin:12px 0;padding:12px;background:#f4f1eb}.adminNotice.error{background:#fbeceb;color:#8b2f2f}.adminNotice.success{background:#edf7ef;color:#246b36}.orderAdmin{border-top:1px solid #e5e1dc;padding:16px 0}.orderMeta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.orderControls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.orderControls input,.orderControls select{padding:9px;border:1px solid #ccc}.orderControls button{padding:9px;border:1px solid #17130f;background:#17130f;color:#fff}.couponRow{border-top:1px solid #e5e1dc;padding:14px 0;display:flex;justify-content:space-between;gap:12px}.couponRow small{display:block;color:#756a60;margin-top:4px}@media(max-width:700px){.productForm,.couponForm,.orderControls,.orderMeta{grid-template-columns:1fr}.productForm .full,.couponForm .full{grid-column:auto}.productRow{grid-template-columns:55px 1fr}.productThumb{width:55px;height:70px}.productRowActions{grid-column:1/-1;justify-content:flex-start}}</style></head><body><div class="top">ATSHREE · ADMIN</div><nav class="nav"><a class="logo" href="/index.html">ATSHREE</a><div class="links"><a href="#orders">ORDERS</a><a href="#products">PRODUCTS</a><a href="#customers">CUSTOMERS</a><a href="#rewards">REWARDS</a><a href="#coupons">COUPONS</a></div><a class="bag" href="/index.html">STORE</a></nav><main><section class="pageHero"><div class="wrap"><div class="ey">ATSHREE CONTROL CENTER</div><h1>Admin Dashboard</h1><p>Store operations.</p></div></section><section class="section"><div class="wrap"><div id="adminMessage" class="secureText">Checking admin access…</div><div id="adminNotice"></div><div class="productAdmin"><details open><summary id="productEditorTitle">Add new product</summary><form id="productForm" class="productForm"><input type="hidden" id="productId"><label>Product name *<input id="productName" required></label><label>Category *<select id="productCategory"><option>Men</option><option>Women</option><option>New In</option></select></label><label>Price (₹) *<input id="productPrice" type="number" min="0" step=".01" required></label><label>Sale price (₹)<input id="productSalePrice" type="number" min="0" step=".01"></label><label>SKU<input id="productSku"></label><label>Initial stock *<input id="productStock" type="number" min="0" step="1" value="0" required></label><label>Sizes<input id="productSizes" placeholder="S, M, L, XL"></label><label>Colors<input id="productColors" placeholder="Ivory, Beige"></label><label class="full">Product image<input id="productImage" type="file" accept="image/jpeg,image/png,image/webp"><img id="imagePreview" class="imagePreview"></label><label class="full">Image URL<input id="productImageUrl" type="url"></label><label class="full">Description<textarea id="productDescription"></textarea></label><label>Fabric<input id="productFabric"></label><label>Care<input id="productCare"></label><div class="productChecks full"><label><input id="productFeatured" type="checkbox"> Featured</label><label><input id="productActive" type="checkbox" checked> Visible on store</label></div><div class="productActions full"><button type="submit" id="saveProductBtn">ADD PRODUCT</button><button type="button" class="secondary" id="cancelEditBtn">CLEAR</button></div></form></details></div><div class="couponAdmin"><details><summary>Coupon management</summary><form id="couponForm" class="couponForm"><label>Code *<input id="couponCode" required placeholder="WELCOME10"></label><label>Type<select id="couponType"><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select></label><label>Discount value *<input id="couponValue" type="number" min="0.01" step=".01" required></label><label>Minimum order<input id="couponMin" type="number" min="0" step=".01" value="0"></label><label>Maximum discount<input id="couponMax" type="number" min="0" step=".01"></label><label>Expires at<input id="couponExpires" type="datetime-local"></label><label>Usage limit<input id="couponLimit" type="number" min="1"></label><label class="productChecks"><input id="couponActive" type="checkbox" checked> Active</label><div class="productActions full"><button type="submit">CREATE COUPON</button></div></form><div id="couponsList"></div></details></div><div class="grid4" id="stats"></div><div class="accountGrid accountLower"><div class="accountCard" id="orders"><h2>Orders</h2><div id="ordersList"></div></div><div class="accountCard" id="customers"><h2>Customers</h2><div id="customersList"></div></div></div><div class="accountGrid accountLower"><div class="accountCard" id="products"><h2>Products & Inventory</h2><div id="productsList"></div></div><div class="accountCard" id="rewards"><h2>Rewards</h2><div id="rewardsList"></div></div></div></div></section></main><script type="module" src="/admin.js"></script><script src="/admin-growth.js"></script></body></html>
